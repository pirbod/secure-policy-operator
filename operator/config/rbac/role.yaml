apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secure-policy-operator
rules:
  - apiGroups:
      - policy.customer-cloud.io
    resources:
      - policysources
      - policysources/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - templates.gatekeeper.sh
    resources:
      - constrainttemplates
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - constraints.gatekeeper.sh
    resources:
      - '*'
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups:
      - ''
    resources:
      - events
    verbs:
      - create
      - patch
