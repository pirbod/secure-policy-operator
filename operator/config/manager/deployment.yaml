apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-policy-operator
  namespace: secure-policy-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-policy-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-policy-operator
    spec:
      serviceAccountName: secure-policy-operator
      containers:
        - name: manager
          image: ghcr.io/pirbod/secure-policy-operator:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
