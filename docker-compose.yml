services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: customer-cloud-policy-operator-api:local
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: customer-cloud-policy-operator-web:local
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
