apiVersion: customer-cloud.platform/v1alpha1
kind: CustomerEnvironmentBlueprint
metadata:
  name: regulated-bank-tanzu
  customer: Regulated Bank
spec:
  cloudProvider: hybrid
  kubernetesTarget: tanzu
  complianceLevel: high
  gitOpsRepoLayout:
    clusters: clusters/regulated-bank/tanzu
    apps: apps/regulated-bank
    policies: policies/regulated-policy-pack
    runbooks: runbooks/regulated-bank
  terraformModules:
  - terraform/modules/vmware-tanzu
  - terraform/modules/vmware-tanzu#ingress-package
  - terraform/modules/vmware-tanzu#certificate-validation
  policyPack:
    name: regulated-policy-pack
    controls:
    - non-root-containers
    - deny-privileged-containers
    - required-network-policy
    - approved-image-registries
    - audit-logging-required
  observabilityPack:
    name: full-audit-observability
    signals:
    - cluster-health
    - deployment-drift
    - policy-violations
    - support-readiness
  platformSpecific:
    vmwareTanzu:
      packageManagement:
      - cert-manager
      - contour or ingress package
      - external-secrets
      ingress: domain, route, and TLS certificate chain validation
      policy: Tanzu package and pod security baseline mapping
      observability:
      - package health
      - ingress synthetic check
      - OpenSearch storage alert
      storage: Tanzu storage policy mapped to stateful dependencies
  cicdGates:
  - terraform-plan-review
  - manifest-schema-validation
  - policy-conformance-test
  - argocd-presync-validation
  requiredRunbooks:
  - database-storage-and-backup
  - deployment-validation
  - incident-handover
  - opensearch-disk-pressure
  - policy-violation-remediation
  - tanzu-ingress-certificate-check
  supportHandoverChecklist:
  - customer profile attached
  - known issues mapped
  - observability dashboard linked
  - escalation path agreed
  - go-live validation recorded
  estimatedGoLivePlan:
  - day: 1
    activity: confirm prerequisites and customer inputs
  - day: 2
    activity: apply Terraform landing zone modules
  - day: 3
    activity: sync GitOps baseline and policy pack
  - day: 4
    activity: validate observability, drift, and data dependencies
  - day: 5
    activity: support handover and controlled go-live
