apiVersion: customer-cloud.platform/v1alpha1
kind: CustomerEnvironmentBlueprint
metadata:
  name: manufacturing-cloud-openshift
  customer: Manufacturing Cloud
spec:
  cloudProvider: hybrid
  kubernetesTarget: openshift
  complianceLevel: high
  gitOpsRepoLayout:
    clusters: clusters/manufacturing-cloud/openshift
    apps: apps/manufacturing-cloud
    policies: policies/regulated-policy-pack
    runbooks: runbooks/manufacturing-cloud
  terraformModules:
  - terraform/modules/openshift
  - terraform/modules/openshift#scc-mapping
  - terraform/modules/openshift#network-segmentation
  policyPack:
    name: regulated-policy-pack
    controls:
    - non-root-containers
    - deny-privileged-containers
    - required-network-policy
    - approved-image-registries
    - audit-logging-required
  observabilityPack:
    name: full-audit-observability
    signals:
    - cluster-health
    - deployment-drift
    - policy-violations
    - support-readiness
  platformSpecific:
    openShift:
      securityContextConstraints:
      - restricted-v2
      - service account SCC review
      operatorPattern: namespaced operator subscriptions managed by GitOps
      networking:
      - namespace deny-by-default
      - egress allow-list
      - route policy
      audit: OpenShift audit profile evidence attached before regulated go-live
      storage: approved encrypted storage class for database-heavy workloads
  cicdGates:
  - terraform-plan-review
  - manifest-schema-validation
  - policy-conformance-test
  - argocd-presync-validation
  requiredRunbooks:
  - database-storage-and-backup
  - deployment-validation
  - incident-handover
  - openshift-scc-blocked-workload
  - policy-violation-remediation
  supportHandoverChecklist:
  - customer profile attached
  - known issues mapped
  - observability dashboard linked
  - escalation path agreed
  - go-live validation recorded
  estimatedGoLivePlan:
  - day: 1
    activity: confirm prerequisites and customer inputs
  - day: 2
    activity: apply Terraform landing zone modules
  - day: 3
    activity: sync GitOps baseline and policy pack
  - day: 4
    activity: validate observability, drift, and data dependencies
  - day: 5
    activity: support handover and controlled go-live
