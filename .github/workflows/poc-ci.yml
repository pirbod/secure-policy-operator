name: Customer Cloud Policy Operator PoC CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature-operator

jobs:
  api:
    name: Python API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Compile Python
        run: python -m compileall apps/api scripts
      - name: Run unit tests
        run: PYTHONPATH="$PWD" python -m unittest discover apps/api/tests
      - name: Validate demo scripts
        run: make validate-demo

  web:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix apps/web ci
      - name: Typecheck
        run: npm --prefix apps/web run typecheck
      - name: Build
        run: npm --prefix apps/web run build

  policy:
    name: Kubernetes and policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform
      - name: Install conftest
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz -o conftest.tar.gz
          tar -xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/conftest
      - name: Validate Kubernetes manifests
        run: kubeconform -summary -ignore-missing-schemas policies operator/config
      - name: Run conftest policy checks
        run: conftest test policies operator/config -p .github/conftest

  docker-compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start demo stack
        run: docker compose up -d
      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/api/health >/dev/null && curl -fsS http://localhost:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Stop demo stack
        if: always()
        run: docker compose down -v
